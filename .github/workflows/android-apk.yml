
name: Construire APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer les dépendances système
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-venv \
            build-essential ccache libffi-dev libssl-dev zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo6 cmake autoconf automake libtool pkg-config \
            libltdl-dev gettext

      - name: Installer Buildozer
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython

      - name: Nettoyer l'ancien SDK Android
        run: |
          rm -rf "$HOME/.buildozer/android/platform/android-sdk"

      
      - name: Construire l'APK
        run: |
          . .venv/bin/activate
          buildozer -v android debug


      - name: Publier l'APK comme artefact téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: Chevalier-du-Volcan-APK
          path: bin/*.apk
          if-no-files-found: error
